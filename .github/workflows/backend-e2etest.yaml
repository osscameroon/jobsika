name: Run end to end tests

on:
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - Makefile
      - .github/workflows/backend-e2etest.yaml

jobs:
  e2etest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      # the api runs in docker, node is only needed to install the e2etests dependencies
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Run Backend Tests
        run: make e2etest
