name: Backend Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - Makefile
      - .github/workflows/backend-lint.yaml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # runs in a golang docker image, no go setup needed
      - name: Run lint
        run: make lint-backend
