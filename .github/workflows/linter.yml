name: Lint

on:
  pull_request:
    paths:
      - .github/workflows/linter.yml
      - frontend/**
      - Makefile
      - docker-compose.yml
jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      # runs in the node image of the frontend-dev compose service, no node setup needed
      - run: make lint-frontend
