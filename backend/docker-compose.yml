services:
  postgres:
    image: postgres:14.1-alpine
    restart: always
    env_file:
      - ./.docker-env
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # applies the migrations and loads the fixtures, then exits
  start-postgres:
    build: ./scripts/setup-postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: /api/scripts/setup-postgres/setup-postgres.sh
    env_file:
      - ./.docker-env
    volumes:
      - .:/api:ro

  api:
    build: .
    depends_on:
      start-postgres:
        condition: service_completed_successfully
    env_file:
      - ./.docker-env
      - ./.api-env
      # optional, copy .opencollective-env-example to enable payments
      - path: ./.opencollective-env
        required: false
    environment:
      - ENVIRONMENT=development
    ports:
      - 7000:7000

volumes:
  postgres-data:
