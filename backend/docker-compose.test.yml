services:
  postgres:
    image: postgres:14.1-alpine
    env_file:
      - ./.docker-env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  start-postgres:
    build: ./scripts/setup-postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: /api/scripts/setup-postgres/setup-postgres.sh
    env_file:
      - ./.docker-env
    volumes:
      - .:/api:ro

  api:
    build: .
    depends_on:
      start-postgres:
        condition: service_completed_successfully
    env_file:
      - ./.docker-env
    environment:
      - TEST=true
      - ENVIRONMENT=development
    ports:
      - 7000:7000

  e2etests:
    depends_on:
      - api
    image: node:20-bookworm-slim
    command: /api/scripts/wait-for-it/wait-for-it.sh api:7000 -t 300 -- npm --prefix /api/e2etests test
    environment:
      API_HOST: "http://api:7000/"
    volumes:
      - .:/api
